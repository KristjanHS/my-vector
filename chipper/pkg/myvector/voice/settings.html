<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wire-Pod - Language &amp; voice</title>
  <link rel="stylesheet" type="text/css" href="/css/style.css" />
  <style>
    .voice-box { max-width: 420px; margin: 24px auto; padding: 0 16px; }
    .voice-box label { display: block; margin: 6px 0; }
    .voice-box fieldset { margin: 8px 0; }
    .voice-box input[type=range] { width: 100%; }
    #status { min-height: 1.4em; }
  </style>
</head>
<body>
  <div class="voice-box">
    <p><a href="/">&larr; Wire-Pod</a></p>
    <h2>Language &amp; voice</h2>
    <form id="form">
      <fieldset><legend>Language</legend><div id="lang"></div></fieldset>
      <h3>English voices</h3>
      <fieldset><legend>T1: LLM answers</legend><div id="t1"></div></fieldset>
      <fieldset><legend>T2: robot's own lines (time, weather…)</legend><div id="t2"></div></fieldset>
      <h3>Eesti hääled</h3>
      <fieldset><legend>T1: LLM answers</legend><div id="t1_et"></div></fieldset>
      <fieldset><legend>T2: robot's own lines</legend><div id="t2_et"></div></fieldset>
      <label>Slow factor (T1 and T2): <output id="slowOut"></output>
        <input type="range" id="slow" step="0.05" />
      </label>
      <label>Sample text:
        <textarea id="sample" rows="3" maxlength="599" style="width: 100%">Hi, I'm Vector. It's a lovely day, and I'm happy to help. What would you like to know?</textarea>
      </label>
      <button type="button" id="test">Test the selected language's T1 on Vector</button>
      <button type="submit">Save</button>
    </form>
    <p id="status"></p>
  </div>
  <script>
    const api = "/myvector/api/voice";
    const $ = (id) => document.getElementById(id);
    const status = (t) => { $("status").textContent = t; };
    const names = { "en-US": "English", "et-EE": "Eesti" };
    const samples = { "en-US": $("sample").value, "et-EE": "Tere, mina olen Vector. Täna on ilus päev. Millega saan aidata?" };
    const radios = (id, values, checked, label = (v) => v) => $(id).replaceChildren(...values.map((v) => {
      const l = document.createElement("label");
      const r = Object.assign(document.createElement("input"), { type: "radio", name: id, value: v, checked: v === checked });
      l.append(r, " " + label(v));
      return l;
    }));
    const pick = (t) => { const r = document.querySelector(`input[name=${t}]:checked`); return r && r.value; };
    function show(s) {
      radios("lang", s.langs, s.lang, (l) => names[l] || l);
      for (const [t, l] of [["t1", "en-US"], ["t2", "en-US"], ["t1_et", "et-EE"], ["t2_et", "et-EE"]]) radios(t, s.voices[l], s[t]);
      syncSample();
      Object.assign($("slow"), { min: s.slowMin, max: s.slowMax, value: s.slow });
      $("slowOut").textContent = s.slow.toFixed(2);
    }
    async function call(opts, url = api) {
      const r = await fetch(url, opts);
      if (!r.ok) throw new Error((await r.text()).trim());
      return r.json();
    }
    function post(extra) {
      return { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ lang: pick("lang"), t1: pick("t1"), t2: pick("t2"), t1_et: pick("t1_et"), t2_et: pick("t2_et"),
          slow: Number($("slow").value), ...extra }) };
    }
    function syncSample() { // swap the sample only while it still holds a default
      const l = pick("lang");
      if (Object.values(samples).includes($("sample").value) && samples[l]) $("sample").value = samples[l];
    }
    $("lang").addEventListener("change", syncSample);
    $("slow").addEventListener("input", (e) => { $("slowOut").textContent = Number(e.target.value).toFixed(2); });
    $("test").addEventListener("click", async () => {
      $("test").disabled = true;
      status("Speaking on Vector…");
      try { status("Spoke: " + (await call(post({ text: $("sample").value }), api + "/test")).voice); }
      catch (err) { status("Test failed: " + err.message); }
      finally { $("test").disabled = false; }
    });
    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      status("Saving…");
      try {
        const s = await call(post());
        show(s);
        status(s.pushError ? "Saved; robot not updated: " + s.pushError : "Saved; robot updated.");
      } catch (err) { status("Not saved: " + err.message); }
    });
    call().then(show).catch((err) => status("Could not load: " + err.message));
  </script>
</body>
</html>
